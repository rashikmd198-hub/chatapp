<!DOCTYPE html>
<html>

<head>
    <title>Login</title>
    <style>
        body {
            font-family: Arial;
            max-width: 400px;
            margin: 100px auto;
            text-align: center;
        }

        input {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            font-size: 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
        }

        .error {
            color: red;
        }

        a {
            display: block;
            margin-top: 12px;
        }
    </style>
</head>

<body>
    <h2>Login</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}

        <input type="text" name="username" placeholder="Username" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>

    <a href="/register/">Don't have an account? Register</a>
</body>

</html>
