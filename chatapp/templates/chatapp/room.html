<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ room_name }} — Chat</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&family=DM+Sans:wght@300;400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0d0f14;
            --surface: #151820;
            --surface2: #1c2030;
            --border: #252a3a;
            --accent: #6c63ff;
            --accent2: #ff6584;
            --text: #e8eaf0;
            --muted: #6b7280;
            --own-bg: linear-gradient(135deg, #6c63ff, #8b5cf6);
            --other-bg: #1c2030;
            --green: #22c55e;
            --radius: 18px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100dvh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Ambient background */
        body::before {
            content: '';
            position: fixed;
            top: -200px;
            left: -200px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(108, 99, 255, 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: '';
            position: fixed;
            bottom: -200px;
            right: -200px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 101, 132, 0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* ── Header ── */
        .header {
            position: relative;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 24px;
            background: rgba(21, 24, 32, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .room-avatar {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: var(--own-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 16px;
            color: white;
            text-transform: uppercase;
            flex-shrink: 0;
        }

        .room-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .room-name {
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            font-size: 17px;
            color: var(--text);
            letter-spacing: -0.3px;
        }

        .room-status {
            font-size: 12px;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--muted);
            transition: background 0.3s;
        }

        .status-dot.online {
            background: var(--green);
            box-shadow: 0 0 6px var(--green);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .user-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 50px;
            font-size: 13px;
            color: var(--muted);
        }

        .user-chip span {
            color: var(--text);
            font-weight: 500;
        }

        /* ── Messages ── */
        #chat-log {
            flex: 1;
            overflow-y: auto;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            position: relative;
            z-index: 1;
            scroll-behavior: smooth;
        }

        #chat-log::-webkit-scrollbar {
            width: 4px;
        }

        #chat-log::-webkit-scrollbar-track {
            background: transparent;
        }

        #chat-log::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        /* Date divider */
        .date-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 16px 0 8px;
            color: var(--muted);
            font-size: 11px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .date-divider::before,
        .date-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        /* Message row */
        .message-row {
            display: flex;
            gap: 10px;
            align-items: flex-end;
            max-width: 75%;
            animation: msgIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        @keyframes msgIn {
            from {
                opacity: 0;
                transform: translateY(12px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .message-row.own {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-row.other {
            align-self: flex-start;
        }

        /* Avatar */
        .msg-avatar {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            background: var(--surface2);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            color: var(--accent);
            flex-shrink: 0;
            text-transform: uppercase;
        }

        .message-row.own .msg-avatar {
            background: linear-gradient(135deg, #6c63ff22, #8b5cf622);
            color: #a78bfa;
        }

        /* Bubble */
        .bubble {
            padding: 11px 16px;
            border-radius: 18px;
            font-size: 14.5px;
            line-height: 1.5;
            word-break: break-word;
            position: relative;
        }

        .message-row.other .bubble {
            background: var(--other-bg);
            border: 1px solid var(--border);
            border-bottom-left-radius: 6px;
            color: var(--text);
        }

        .message-row.own .bubble {
            background: var(--own-bg);
            border-bottom-right-radius: 6px;
            color: white;
            box-shadow: 0 4px 20px rgba(108, 99, 255, 0.3);
        }

        .bubble-sender {
            font-size: 11px;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 4px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .message-row.own .bubble-sender {
            display: none;
        }

        /* Consecutive messages */
        .message-row.consecutive {
            margin-top: -2px;
        }

        .message-row.consecutive .msg-avatar {
            opacity: 0;
        }

        .message-row.other.consecutive .bubble {
            border-top-left-radius: 6px;
        }

        .message-row.own.consecutive .bubble {
            border-top-right-radius: 6px;
        }

        /* Empty state */
        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            color: var(--muted);
            padding: 40px;
            text-align: center;
        }

        .empty-icon {
            width: 64px;
            height: 64px;
            border-radius: 20px;
            background: var(--surface2);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 4px;
        }

        .empty-state h3 {
            font-family: 'Syne', sans-serif;
            font-size: 18px;
            color: var(--text);
        }

        .empty-state p {
            font-size: 14px;
            max-width: 260px;
        }

        /* ── Footer ── */
        .footer {
            position: relative;
            z-index: 10;
            padding: 16px 20px;
            background: rgba(21, 24, 32, 0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
        }

        .input-row {
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 8px 8px 8px 18px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-row:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.15);
        }

        #msg-input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            color: var(--text);
            resize: none;
            max-height: 120px;
            line-height: 1.5;
        }

        #msg-input::placeholder {
            color: var(--muted);
        }

        #send-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--own-bg);
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: transform 0.15s, opacity 0.15s;
        }

        #send-btn:hover {
            transform: scale(1.08);
        }

        #send-btn:active {
            transform: scale(0.95);
        }

        #send-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        #send-btn svg {
            width: 18px;
            height: 18px;
            fill: white;
        }

        /* Status bar */
        #status-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 4px 0;
            font-size: 11px;
            color: var(--muted);
            min-height: 22px;
        }

        /* Typing indicator */
        .typing-dots {
            display: flex;
            gap: 3px;
            align-items: center;
        }

        .typing-dots span {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: var(--accent);
            animation: dot 1.2s infinite;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes dot {

            0%,
            80%,
            100% {
                transform: scale(0.6);
                opacity: 0.4;
            }

            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* ── Mobile ── */
        @media (max-width: 600px) {
            .header {
                padding: 12px 16px;
            }

            .user-chip {
                display: none;
            }

            #chat-log {
                padding: 16px 12px;
            }

            .message-row {
                max-width: 88%;
            }

            .footer {
                padding: 12px 14px;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <div class="header">
        <div class="header-left">
            <div class="room-avatar" id="room-avatar">{{ room_name|slice:":2" }}</div>
            <div class="room-info">
                <div class="room-name"># {{ room_name }}</div>
                <div class="room-status">
                    <div class="status-dot" id="status-dot"></div>
                    <span id="status-text">Connecting...</span>
                </div>
            </div>
        </div>
        <div class="header-right">
            <div class="user-chip">
                👤 <span>{{ request.user.username }}</span>
            </div>
        </div>
    </div>

    <!-- Messages -->
    <div id="chat-log">
        <div class="empty-state" id="empty-state">
            <div class="empty-icon">💬</div>
            <h3>Start the conversation</h3>
            <p>Be the first to send a message in <strong>#{{ room_name }}</strong></p>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <div class="input-row">
            <input id="msg-input" type="text" placeholder="Message #{{ room_name }}..." autocomplete="off">
            <button id="send-btn" disabled title="Send message">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
                </svg>
            </button>
        </div>
        <div id="status-bar"></div>
    </div>

    <script>
        const roomName = "{{ room_name }}";
        const currentUser = "{{ request.user.username }}";
        let lastSender = null;
        let messageCount = 0;

        const chatLog = document.getElementById('chat-log');
        const emptyState = document.getElementById('empty-state');
        const msgInput = document.getElementById('msg-input');
        const sendBtn = document.getElementById('send-btn');
        const statusDot = document.getElementById('status-dot');
        const statusText = document.getElementById('status-text');
        const statusBar = document.getElementById('status-bar');

        // WebSocket
        const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
        const socket = new WebSocket(`${protocol}://${window.location.host}/ws/chat/${roomName}/`);

        socket.onopen = function () {
            statusDot.classList.add('online');
            statusText.textContent = 'Connected';
            sendBtn.disabled = false;
            setStatusBar('');
        };

        socket.onclose = function (e) {
            statusDot.classList.remove('online');
            statusText.textContent = 'Disconnected';
            sendBtn.disabled = true;
            setStatusBar('⚠️ Connection lost — please refresh');
        };

        socket.onerror = function () {
            setStatusBar('⚠️ Connection error');
        };

        socket.onmessage = function (e) {
            const data = JSON.parse(e.data);
            appendMessage(data.sender, data.message);
        };

        function appendMessage(sender, text) {
            if (emptyState) emptyState.remove();

            const isOwn = sender === currentUser;
            const isConsecutive = sender === lastSender;
            lastSender = sender;
            messageCount++;

            const row = document.createElement('div');
            row.classList.add('message-row', isOwn ? 'own' : 'other');
            if (isConsecutive) row.classList.add('consecutive');

            const initial = sender.charAt(0).toUpperCase();

            row.innerHTML = `
            <div class="msg-avatar">${initial}</div>
            <div class="bubble">
                ${!isOwn && !isConsecutive ? `<div class="bubble-sender">${sender}</div>` : ''}
                ${escapeHtml(text)}
            </div>
        `;

            chatLog.appendChild(row);
            chatLog.scrollTop = chatLog.scrollHeight;
        }

        function escapeHtml(text) {
            return text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function setStatusBar(msg) {
            statusBar.textContent = msg;
        }

        // Send message
        function sendMessage() {
            const msg = msgInput.value.trim();
            if (msg && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ message: msg }));
                msgInput.value = '';
                msgInput.focus();
            }
        }

        sendBtn.onclick = sendMessage;

        msgInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Enable/disable send button based on input
        msgInput.addEventListener('input', function () {
            sendBtn.disabled = !this.value.trim() || socket.readyState !== WebSocket.OPEN;
        });
    </script>
</body>

</html>
