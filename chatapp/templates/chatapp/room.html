<!DOCTYPE html>
<html>

<head>
    <title>Room: {{ room_name }}</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            padding: 14px 20px;
            border-bottom: 1px solid #ddd;
            font-size: 18px;
            font-weight: bold;
        }

        #chat-log {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f9f9f9;
        }

        .message {
            margin-bottom: 12px;
            padding: 10px 14px;
            background: white;
            border-radius: 8px;
            border: 1px solid #eee;
            max-width: 60%;
        }

        .message .sender {
            font-weight: bold;
            color: #007bff;
            margin-bottom: 4px;
            font-size: 13px;
        }

        .message.own {
            margin-left: auto;
            background: #007bff;
            color: white;
            border: none;
        }

        .message.own .sender {
            color: #cce5ff;
        }

        .footer {
            padding: 12px 16px;
            border-top: 1px solid #ddd;
            display: flex;
            gap: 10px;
            background: white;
        }

        #msg-input {
            flex: 1;
            padding: 10px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        #send-btn {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
        }

        #status {
            font-size: 12px;
            color: #888;
            padding: 4px 20px;
            background: #fff;
        }
    </style>
</head>

<body>

    <div class="header">Room: {{ room_name }}</div>
    <div id="status">Connecting...</div>
    <div id="chat-log"></div>

    <div class="footer">
        <input id="msg-input" type="text" placeholder="Type a message...">
        <button id="send-btn">Send</button>
    </div>

    <script>
        const roomName = "{{ room_name }}";
        const currentUser = "{{ request.user.username }}";

        // ✓ Fix: use wss:// on HTTPS (Railway), ws:// on local
        const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
        const socket = new WebSocket(`${protocol}://${window.location.host}/ws/chat/${roomName}/`);

        socket.onopen = function () {
            document.getElementById('status').textContent = 'Connected ✓';
            document.getElementById('status').style.color = 'green';
            console.log('WebSocket connected!');
        };

        socket.onclose = function (e) {
            document.getElementById('status').textContent = 'Disconnected ✗ — refresh the page';
            document.getElementById('status').style.color = 'red';
            console.log('WebSocket closed:', e.code, e.reason);
        };

        socket.onerror = function (e) {
            document.getElementById('status').textContent = 'Connection error ✗';
            document.getElementById('status').style.color = 'red';
            console.error('WebSocket error:', e);
        };

        socket.onmessage = function (e) {
            console.log('Message received:', e.data);
            const data = JSON.parse(e.data);
            const box = document.getElementById('chat-log');

            const div = document.createElement('div');
            div.classList.add('message');
            if (data.sender === currentUser) div.classList.add('own');

            div.innerHTML = `<div class="sender">${data.sender}</div><div>${data.message}</div>`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        };

        document.getElementById('send-btn').onclick = sendMessage;

        document.getElementById('msg-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage();
        });

        function sendMessage() {
            const input = document.getElementById('msg-input');
            const msg = input.value.trim();
            if (msg && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({ message: msg }));
                input.value = '';
            } else if (socket.readyState !== WebSocket.OPEN) {
                alert('Not connected! Please refresh the page.');
            }
        }
    </script>
</body>

</html>
