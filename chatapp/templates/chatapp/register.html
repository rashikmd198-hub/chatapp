<!DOCTYPE html>
<html>

<head>
    <title>Register</title>
    <style>
        body {
            font-family: Arial;
            max-width: 400px;
            margin: 100px auto;
        }

        input {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            font-size: 15px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
        }

        a {
            display: block;
            margin-top: 12px;
            text-align: center;
        }

        ul {
            color: red;
        }
    </style>
</head>

<body>
    <h2>Register</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Create Account</button>
    </form>

    <a href="/accounts/login/">Already have an account? Login</a>
</body>

</html>
